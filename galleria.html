<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Galleria Fotografica</title>
  <style>
    :root {
      --primary: #1a365d;
      --secondary: #2d3748;
      --accent: #3182ce;
      --dark: #0f1419;
      --darker: #0a0e12;
      --glass: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #000000;
      color: #fff;
      line-height: 1.6;
      min-height: 100vh;
    }

    .header {
      width: 100%;
      background: var(--glass);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid var(--glass-border);
      padding: 0;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 100;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    .nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
      height: 70px;
    }

    .nav a {
      color: #fff;
      text-decoration: none;
      font-size: 1.1em;
      font-weight: 500;
      padding: 10px 20px;
      border-radius: 25px;
      transition: all 0.3s ease;
      position: relative;
    }

    .nav a:hover {
      background: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(49, 130, 206, 0.3);
    }

    .nav a::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 0;
      height: 2px;
      background: var(--accent);
      transition: all 0.3s ease;
      transform: translateX(-50%);
    }

    .nav a:hover::after {
      width: 100%;
    }
    .gallery {
      margin-top: 100px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 40px;
      padding: 40px 30px;
      justify-items: center;
    }

    .gallery img, .edit-gallery img, .basket-gallery img, .calcio-gallery img {
      width: 100%;
      max-width: 350px;
      height: auto;
      aspect-ratio: 1;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      object-fit: cover;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      background: #000000;
      opacity: 0;
      transform: translateY(40px) scale(0.9);
      animation: fadeInUp 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      cursor: pointer !important;
      pointer-events: auto !important;
      user-select: none;
    }

    .gallery img:hover, .edit-gallery img:hover, .basket-gallery img:hover, .calcio-gallery img:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 20px 60px rgba(49, 130, 206, 0.2);
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .section-title {
      font-size: 2.8em;
      font-weight: 700;
      text-align: center;
      margin: 60px 0 40px 0;
      background: linear-gradient(135deg, #fff, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-transform: uppercase;
      letter-spacing: 2px;
      position: relative;
    }

    .section-title::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      width: 80px;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), transparent);
      transform: translateX(-50%);
      border-radius: 2px;
    }
    .edit-section {
      margin-top: 80px;
      text-align: center;
    }

    .edit-section h2, .basket-section h2, .calcio-section h2 {
      font-size: 2.8em;
      font-weight: 700;
      margin: 60px 0 40px 0;
      background: linear-gradient(135deg, #fff, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-transform: uppercase;
      letter-spacing: 2px;
      position: relative;
    }

    .edit-section h2::after, .basket-section h2::after, .calcio-section h2::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      width: 80px;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), transparent);
      transform: translateX(-50%);
      border-radius: 2px;
    }
    .edit-gallery {

      gap: 40px;
      padding: 40px 30px;
      justify-items: center;
    }

    .edit-gallery img {
      width: 100%;

      user-select: none;
    }

    .edit-gallery img:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 20px 60px rgba(49, 130, 206, 0.2);
    }
    .basket-section, .calcio-section {
      margin-top: 80px;
      text-align: center;
    }
    .basket-section h2, .calcio-section h2 {
      color: #fff;
      font-size: 2em;
      margin-bottom: 30px;
    }
    .basket-gallery, .calcio-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 40px;
      padding: 40px 30px;
      justify-items: center;
    }
    .basket-gallery img, .calcio-gallery img {
      width: 100%;
      max-width: 350px;
      height: auto;
      aspect-ratio: 1;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      object-fit: cover;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      background: #000000;
      opacity: 0;
      transform: translateY(40px) scale(0.9);
      animation: fadeInUp 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      cursor: pointer !important;
      pointer-events: auto !important;
      user-select: none;
    }
    .basket-gallery img:hover, .calcio-gallery img:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 20px 60px rgba(49, 130, 206, 0.2);
    }
    .lightbox-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 999;
      justify-content: center;
      align-items: center;
    }
    .lightbox-overlay.show {
      display: flex !important;
    }
    .lightbox-content {
      position: relative;
      max-width: 95%;
      max-height: 95vh;
    }
    .lightbox-content img {
      max-width: 100%;
      max-height: 90vh;
      border-radius: 8px;
    }
    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 30px;
      color: white;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
      z-index: 1000;
      background: rgba(0,0,0,0.5);
      padding: 5px 15px;
      border-radius: 5px;
    }
    .lightbox-close:hover {
      background: rgba(255,255,255,0.3);
    }
  </style>
  <script>
    window.addEventListener('DOMContentLoaded', function() {
      // Lazy load
      document.querySelectorAll('img').forEach(img => {
        if (!img.hasAttribute('loading')) img.setAttribute('loading', 'lazy');
      });

      // Lightbox semplificato e robusto
      const overlay = document.getElementById('lightbox-overlay');
      const modalImg = document.getElementById('lightbox-img');
      const closeBtn = document.getElementById('lightbox-close');

      if (!overlay || !modalImg || !closeBtn) {
        console.error('Lightbox elements not found');
        return;
      }

      console.log('Lightbox initialized');

      // Funzione per aprire lightbox
      function openLightbox(imgSrc) {
        console.log('Opening lightbox with:', imgSrc);
        modalImg.src = imgSrc;
        overlay.classList.add('show');
      }

      // Funzione per chiudere lightbox
      function closeLightbox() {
        console.log('Closing lightbox');
        overlay.classList.remove('show');
        modalImg.src = '';
      }

      // Attacca event listeners alle immagini
      function attachLightboxListeners() {
        const allImages = document.querySelectorAll('.basket-gallery img, .calcio-gallery img, .edit-gallery img');
        console.log('Found', allImages.length, 'images to attach listeners');

        allImages.forEach((img, index) => {
          img.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            console.log('Image clicked:', index, this.src);
            openLightbox(this.dataset.full || this.src);
          });

          // Assicurati che il cursor sia pointer
          img.style.cursor = 'pointer';
        });
      }

      // Attacca listeners immediatamente
      attachLightboxListeners();

      // Riattacca listeners dopo un breve delay (per sicurezza)
      setTimeout(attachLightboxListeners, 1000);

      // Event listeners per chiudere
      closeBtn.addEventListener('click', closeLightbox);
      overlay.addEventListener('click', function(e) {
        if (e.target === overlay) closeLightbox();
      });
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeLightbox();
      });
    });
  </script>
