<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Fotografico - Franchini Matteo</title>
  <style>
    :root {
      --primary: #1a365d;
      --secondary: #2d3748;
      --accent: #3182ce;
      --light: #f7fafc;
      --text: #2d3748;
      --glass: rgba(255, 255, 255, 0.25);
      --glass-border: rgba(255, 255, 255, 0.18);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, var(--light) 0%, #e2e8f0 100%);
      color: var(--text);
      line-height: 1.6;
    }

    .header {
      width: 100%;
      background: var(--glass);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--glass-border);
      position: fixed;
      top: 0;
      left: 0;
      z-index: 100;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    }

    .nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
      height: 70px;
      margin: 0;
      padding: 0;
    }

    .nav a {
      color: var(--text);
      text-decoration: none;
      font-size: 1.1em;
      font-weight: 500;
      padding: 10px 20px;
      border-radius: 25px;
      transition: all 0.3s ease;
      position: relative;
    }

    .nav a:hover {
      background: var(--accent);
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(49, 130, 206, 0.3);
    }

    .nav a::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 0;
      height: 2px;
      background: var(--accent);
      transition: all 0.3s ease;
      transform: translateX(-50%);
    }

    .nav a:hover::after { width: 100%; }

    .main {
      margin-top: 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      text-align: center;
      position: relative;
      padding: 40px 20px;
    }

    .hero-content {
      display: flex;
      align-items: center;
      gap: 60px;
      max-width: 1200px;
      width: 100%;
      opacity: 0;
      animation: fadeInUp 1s ease-out 0.2s forwards;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .profile-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .profile-img {
      width: 320px;
      max-width: 90vw;
      height: 320px;
      border-radius: 28px;
      margin: 30px 0 20px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.95);
      padding: 24px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      box-shadow: 0 22px 40px rgba(15, 23, 42, 0.08);
      transition: all 0.3s ease;
    }

    .profile-img:hover {
      transform: translateY(-4px);
      box-shadow: 0 26px 50px rgba(15, 23, 42, 0.12);
    }

    .profile-img img {
      max-width: 88%;
      max-height: 88%;
      display: block;
      object-fit: contain;
      border-radius: 18px;
    }

    .text-content {
      flex: 1;
      text-align: left;
    }

    h1 {
      font-size: 3.5em;
      margin: 0 0 0.2em 0;
      padding: 0;
      letter-spacing: -1px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
    }

    .subtitle {
      font-size: 1.4em;
      color: var(--secondary);
      margin: 0 0 2em 0;
      padding: 0;
      font-weight: 300;
      letter-spacing: 0.5px;
    }

    .description {
      font-size: 1.1em;
      color: var(--text);
      margin: 0 0 2em 0;
      padding: 0;
      line-height: 1.7;
      max-width: 500px;
    }

    .cta-button {
      display: inline-block;
      background: linear-gradient(135deg, var(--accent), var(--primary));
      color: white;
      text-decoration: none;
      padding: 15px 30px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 1.1em;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(49, 130, 206, 0.3);
    }

    .cta-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(49, 130, 206, 0.4);
    }

    /* collaborations section removed */

    @media (max-width: 1024px) {
      .hero-content {
        flex-direction: column;
        gap: 40px;
        text-align: center;
      }
      .text-content { text-align: center; }
      h1 { font-size: 2.8em; }
    }

    @media (max-width: 768px) {
      .nav { gap: 20px; height: 60px; }
      .nav a { font-size: 1em; padding: 8px 16px; }
      .main { margin-top: 80px; padding: 20px 15px; }
      .profile-img { width: 200px; height: 200px; }
      h1 { font-size: 2.2em; }
      .subtitle { font-size: 1.2em; }
      .description { font-size: 1em; }
      /* collaborations styles removed */
    }

    @media (max-width: 480px) {
      .nav { gap: 10px; height: 55px; }
      .hero-content { gap: 30px; }
      .profile-img { width: 160px; height: 160px; }
      h1 { font-size: 1.8em; }
      .subtitle { font-size: 1.1em; }
      .cta-button { padding: 12px 24px; font-size: 1em; }
    }

    /* Partners slider */
    .partners-slider {
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
      padding: 12px 6px;
      background: transparent;
      border-radius: 12px;
    }
    .partners-slider::-webkit-scrollbar { height: 8px; }
    .partners-slider::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 8px; }

    .partners-track {
      display: flex;
      gap: 20px;
      align-items: center;
      padding-bottom: 6px;
    }

    .partners-track img {
      width: 180px;
      height: 80px;
      object-fit: contain;
      background: white;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(15,23,42,0.06);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .partners-track img:hover { transform: translateY(-6px); box-shadow: 0 14px 36px rgba(15,23,42,0.12); }

    @media (max-width: 768px) {
      .partners-track img { width: 140px; height: 64px; }
    }
    @media (max-width: 480px) {
      .partners-track img { width: 120px; height: 56px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="galleria.html">Galleria</a>
      <a href="contatti.html">Contatti</a>
    </nav>
  </div>

  <div class="main">
    <div class="hero-content">
      <div class="profile-section">
        <div class="profile-img">
          <img src="./logo-home.png" alt="Logo MF" width="320" height="320" loading="eager">
        </div>
      </div>

      <div class="text-content">
        <h1>Franchini Matteo</h1>
        <div class="subtitle">Fotografo sportivo Freelance</div>
        <div class="description">
          Creative Media & Sport Photography
        </div>
        <a href="galleria.html" class="cta-button">Scopri il mio lavoro →</a>
      </div>
    </div>
  </div>

  <div class="partners-section" style="width:100%; display:flex; justify-content:center; padding:40px 20px;">
    <div style="max-width:1200px; width:100%;">
      <h3 style="color:var(--primary); margin:0 0 16px 8px; font-size:1.1em; text-transform:uppercase; letter-spacing:1px">Partner</h3>
      <div class="partners-slider" id="partnersSlider" aria-label="Loghi partner">
        <div class="partners-track">
          <img src="partners/basket + log.png" alt="basket + log">
          <img src="partners/garda logo originale.png" alt="Garda">
          <img src="partners/images-fotor-bg-remover-20260713162221.png" alt="logo1">
          <img src="partners/images-fotor-bg-remover-20260713162420.png" alt="logo2">
          <img src="partners/nbb logo.png" alt="NBB">
          <img src="partners/sereno summer logo-fotor-bg-remover-20260713162038.png" alt="sereno">
        </div>
      </div>
    </div>
  </div>
</body>
</body>
  <script>
    (function(){
      const slider = document.getElementById('partnersSlider');
      if(!slider) return;
      let playing = true;
      const step = 220; // pixels to scroll each tick
      const intervalMs = 2500;
      let timer = null;

      function tick(){
        if(!playing) return;
        slider.scrollBy({ left: step, behavior: 'smooth' });
        if(slider.scrollLeft + slider.clientWidth >= slider.scrollWidth - 10){
          // small timeout to let smooth scroll finish
          setTimeout(()=> slider.scrollTo({ left: 0, behavior: 'smooth' }), 600);
        }
      }

      slider.addEventListener('mouseenter', ()=> playing = false);
      slider.addEventListener('mouseleave', ()=> playing = true);

      timer = setInterval(tick, intervalMs);
    })();
  </script>
</html>
